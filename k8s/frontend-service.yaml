apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: monte-carlo-sim
  labels:
    app: options-frontend
    app.kubernetes.io/name: frontend-service
spec:
  type: NodePort
  selector:
    app: options-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
