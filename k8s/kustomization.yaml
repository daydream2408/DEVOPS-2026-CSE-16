  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - hpa.yaml
  # Prometheus
  - monitoring/prometheus-rbac.yaml
  - monitoring/prometheus-pvc.yaml
