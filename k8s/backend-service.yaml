apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: monte-carlo-sim
  labels:
    app: options-backend
    app.kubernetes.io/name: backend-service
spec:
  type: NodePort
  selector:
    app: options-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
