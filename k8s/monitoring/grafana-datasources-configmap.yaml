apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monte-carlo-sim
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monte-carlo-sim.svc.cluster.local:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 5s
